<dom-module id="actindo-grid-time-series-filter">
    <template>
        <style>
            .content {
                align-items: center;
                cursor: pointer;
                display: flex;
                flex-direction: row;
                font-size: 15px;
            }

            paper-dialog > div {
                display: flex;
                flex-direction: row;
                max-width: 700px;
                min-width: 400px;
                width: 50vw;
            }
            paper-dialog > div > div {
                flex-basis: 50%;
            }

            paper-listbox {
                border-left: 1px solid #ccc;
                margin-left: 1em;
                padding: 0;
            }

            paper-item {
                cursor: pointer;
            }

            paper-button {
                margin-top: 1em;
            }
        </style>

        <div class="content" on-click="toggleActive">
            <iron-icon
                icon="watch-later"
                style="margin-right: 0.5em"
            ></iron-icon>
            [[label]]
            <paper-icon-button
                icon$="[[_getDropdownIcon(_active)]]"
                class="arrow-icon"
            ></paper-icon-button>
        </div>

        <paper-dialog
            opened="{{_active}}"
            vertical-align="top"
            vertical-offset="40"
            horizontal-align="right"
        >
            <div>
                <div>
                    <actindo-date-picker
                        id="manualFrom"
                        label="[[__L('actindogrid.from', 'From')]]"
                        format="YYYY-MM-DD HH:mm:ss"
                        always-float-label
                    >
                    </actindo-date-picker>
                    <actindo-date-picker
                        id="manualTo"
                        label="[[__L('actindogrid.to', 'To')]]"
                        format="YYYY-MM-DD HH:mm:ss"
                        always-float-label
                    >
                    </actindo-date-picker>
                    <paper-button on-tap="_onApplyRangeTapped">[[__L('actindogrid.apply_range', 'Apply range')]]</paper-button
                    >
                </div>
                <div>
                    <paper-listbox
                        id="presets"
                        on-selected-item-changed="_onSelectPreset"
                        selected="[[selectInitialPreset]]"
                    >
                        <paper-item data-span="900" data-start="now-15m" data-end="now">[[__L('actindogrid.last_15_minutes', 'Last 15 minutes')]]</paper-item>
                        <paper-item data-span="3600"  data-start="now-1h" data-end="now">[[__L('actindogrid.last_1_hour', 'Last 1 hour')]]</paper-item>
                        <paper-item data-span="10800" data-start="now-3h" data-end="now">[[__L('actindogrid.last_3_hours', 'Last 3 hours')]]</paper-item>
                        <paper-item data-span="21600" data-start="now-6h" data-end="now">[[__L('actindogrid.last_6_hours', 'Last 6 hours')]]</paper-item>
                        <paper-item data-span="43200" data-start="now-12h" data-end="now">[[__L('actindogrid.last_12_hours', 'Last 12 hours')]]</paper-item>
                        <paper-item data-span="86400" data-start="now-1d" data-end="now">[[__L('actindogrid.last_24_hours', 'Last 24 hours')]]</paper-item>
                        <paper-item data-span="172800" data-start="now-2d" data-end="now">[[__L('actindogrid.last_2_days', 'Last 2 days')]]</paper-item>
                    </paper-listbox>
                </div>
            </div>
        </paper-dialog>
    </template>

    <script>
        // DateMathUtils lib

        class ActindoGridTimeSeriesFilter extends Actindo.Element {
            /**
             * Polymer custom element for selecting a time series range.
             *
             * Features:
             *  - Manual date/time selection with validation and date math support.
             *  - Preset quick-select ranges (e.g., last 1 hour).
             *  - Enforces a maximum allowed range (in days).
             *  - Emits 'from' and 'to' as unix timestamps in ms.
             *  - Displays a label summarizing the current selection.
             */
            static get is() {
                return "actindo-grid-time-series-filter";
            }

            static get properties() {
                return {
                    /**
                     * Start timestamp of the currently selected range (unix ms).
                     * @type {number}
                     */
                    from: {
                        type: Number,
                        notify: true,
                    },

                    /**
                     * End timestamp of the currently selected range (unix ms).
                     * @type {number}
                     */
                    to: {
                        type: Number,
                        notify: true,
                    },

                    /**
                     * Displayed label of this component (dropdown closed).
                     * @type {string}
                     */
                    label: {
                        type: String,
                    },

                    /**
                     * the index of the preset to select initially, defaults to 0
                     */
                    selectInitialPreset: {
                        type: Number,
                        value: 0
                    },

                    /**
                     * Maximum allowed date range to be selected (in days).
                     * @type {number}
                     */
                    maximumTimeRangeDays: {
                        type: Number,
                        value: 7,
                    },

                    /**
                     * Whether the dropdown is active (open).
                     * @private
                     * @type {boolean}
                     */
                    _active: {
                        type: Boolean,
                        value: false,
                    },

                    /**
                     * whether the currently selected time slice is relative, i.e. something like now - x or last x y
                     */
                    _isRelative: {
                        type: Boolean,
                    }
                };
            }

            /**
             * Called when the element is attached to the DOM.
             * Sets up custom validation and date math parsing for the date pickers.
             */
            connectedCallback() {
                Polymer.dom(this.root)
                    .querySelectorAll("actindo-date-picker")
                    .forEach((picker) => {
                        // Save original validate method
                        picker._originalValidate = picker.validate;
                        // Override validate to support date math
                        picker.validate = function () {
                            if (!picker._originalValidate()) {
                                // try DateMath
                                if (
                                    null !==
                                    DateMathUtils.parseDateMath(this.value)
                                ) {
                                    this.set("invalid", false);
                                    return true;
                                }
                            }
                            return false;
                        }.bind(picker);
                        // Add getEvaluatedTime to return a moment object from value or date math
                        picker.getEvaluatedTime = function () {
                            const mathParsed = DateMathUtils.parseDateMath(
                                this.value
                            );
                            if (mathParsed === null) {
                                return [moment(this.value), false];
                            } else {
                                return [moment(mathParsed), true];
                            }
                        }.bind(picker);
                    });
            }

            /**
             * Toggles the dropdown dialog open/closed.
             */
            toggleActive() {
                this._active = !this._active;
            }

            /**
             * Returns the icon name for the dropdown arrow based on active state.
             * @param {boolean} active
             * @returns {string}
             */
            _getDropdownIcon(active) {
                return active ? "icons:arrow-drop-up" : "icons:arrow-drop-down";
            }

            /**
             * Handler for the 'Apply range' button.
             * Validates and applies the selected manual date range.
             */
            _onApplyRangeTapped() {
                if (
                    !this.$.manualFrom.value ||
                    this.$.manualFrom.invalid ||
                    !this.$.manualTo.value ||
                    this.$.manualTo.invalid
                ) {
                    return;
                }

                let from, calculatedFrom;
                [from, calculatedFrom] = this.$.manualFrom.getEvaluatedTime();
                let to, calculatedTo;
                [to, calculatedTo] = this.$.manualTo.getEvaluatedTime();

                let fromValue = this.$.manualFrom.value;
                let toValue = this.$.manualTo.value;

                // If to is earlier than from, swap the values
                if (!to.isAfter(from)) {
                    [from, to] = [to, from];
                    [fromValue, toValue] = [toValue, fromValue];
                }

                if (to.diff(from, "days", true) > this.maximumTimeRangeDays) {
                    this.$.manualTo.setProperties({
                        invalid: true,
                        _errorMessage: this.__L('actindogrid.error_range_too_large', 'Range too large, max. {0}d', this.maximumTimeRangeDays),
                    });
                    return;
                }

                this.setRange(
                    from.valueOf(),
                    to.valueOf(),
                    fromValue + " - " + toValue,
                    calculatedTo || calculatedFrom
                );
                this.$.presets.select(null);
            }

            /**
             * Handler for selecting a preset range from the list.
             * @param {CustomEvent} event
             * @param {Object} selection
             */
            _onSelectPreset(event, selection) {
                if (!selection || !selection.value || !selection.value) {
                    return;
                }
                this.selectPreset(selection.value);
            }

            /**
             * activates / refresh the given preset (item from the preset list)
             * @param {Node} preset
             */
            selectPreset(preset) {
                if (!preset) {
                    return;
                }

                const span = parseInt(
                    preset.getAttribute("data-span")
                );
                if (isNaN(span)) {
                    return;
                }
                this.$.manualFrom.value = preset.getAttribute("data-start");
                this.$.manualTo.value = preset.getAttribute("data-end");

                const to = Date.now();
                const from = to - span * 1000;
                this.setRange(from, to, preset.innerText, true);
            }

            /**
             * Sets the current range and label, and closes the dropdown.
             * @param {number} from - Start timestamp (ms)
             * @param {number} to - End timestamp (ms)
             * @param {string} label - Label to display
             * @param {Boolean} isRelative - if the range is relative or absolute
             */
            setRange(from, to, label, isRelative) {
                this.setProperties({
                    to: to,
                    from: from,
                    label: label,
                    _active: false,
                    _isRelative: isRelative,
                });
                this.dispatchEvent(
                    new CustomEvent("time-slice-updated", {
                        to: to,
                        from: from,
                    })
                );
            }

            /**
             * updates the current from and to timestamps in case the current user selection contains something relative,
             * i.e. now - something.
             *
             * @returns {boolean} true if the range was updated, otherwise false (if not refresh is required because the selection is absolute)
             */
            refresh() {
                if (this._isRelative) {
                    const selectedPreset = this.$.presets.selectedItem;
                    if (selectedPreset) {
                        this.selectPreset(selectedPreset);
                    }
                    else
                    {
                        this._onApplyRangeTapped();
                    }
                    return true;
                }

                return false;
            }
        }

        customElements.define(
            ActindoGridTimeSeriesFilter.is,
            ActindoGridTimeSeriesFilter
        );
    </script>
</dom-module>
